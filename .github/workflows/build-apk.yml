name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: unzip -o ./*.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI for Android
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet publish Coffers/Coffers.csproj -c Release -p:AndroidPackageFormat=apk

      - name: Collect the APK
        uses: actions/upload-artifact@v4
        with:
          name: coffers-apk
          path: '**/*-Signed.apk'
          if-no-files-found: error
